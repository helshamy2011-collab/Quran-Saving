<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تحديث رفيق الحفظ</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f0e6; color: #1d2a26;
      font: 18px/1.8 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 24px; }
    @media (prefers-color-scheme: dark) { body { background: #111816; color: #e8eee9; } }
  </style>
</head>
<body>
  <p id="msg">جارٍ تحديث البرنامج…</p>
  <script>
    // يمسح نسخة ملفات البرنامج المحفوظة على الجهاز (وليس بيانات الحفظ) ثم يفتح أحدث إصدار
    (async () => {
      try {
        const regs = (await navigator.serviceWorker?.getRegistrations()) || [];
        await Promise.all(regs.map((r) => r.unregister()));
        const keys = (await window.caches?.keys()) || [];
        await Promise.all(keys.map((k) => caches.delete(k)));
      } catch (e) { /* نكمل على أي حال */ }
      document.getElementById('msg').textContent = 'تم — بيفتح أحدث نسخة…';
      setTimeout(() => location.replace(`./?v=${Date.now()}#home`), 600);
    })();
  </script>
</body>
</html>
