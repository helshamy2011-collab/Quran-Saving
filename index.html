<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>رفيق الحفظ</title>
  <meta name="description" content="برنامج لحفظ القرآن الكريم: خطة حفظ ومراجعة، وتسميع بالصوت مع إخفاء النص ومتابعة نقاط الضعف">
  <meta name="theme-color" content="#0f5c4d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#app">تخطَّ إلى المحتوى</a>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="32" height="32">
      <span>رفيق الحفظ</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="التنقل الرئيسي">
      <button type="button" data-view="home" aria-current="page"><span data-icon="today"></span><span>اليوم</span></button>
      <button type="button" data-view="weak"><span data-icon="target"></span><span>نقاط الضعف</span><span class="badge" id="weak-badge" hidden></span></button>
      <button type="button" data-view="free"><span data-icon="mic"></span><span>تسميع حر</span></button>
      <button type="button" data-view="plan"><span data-icon="sliders"></span><span>الخطة</span></button>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <div class="loading" role="status">جارٍ تحميل المصحف…</div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
